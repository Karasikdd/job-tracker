name: Tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://jobtracker:local_dev_password@127.0.0.1:5432/jobtracker_test
      TEST_DATABASE_URL: postgresql+psycopg://jobtracker:local_dev_password@127.0.0.1:5432/jobtracker_test
      SECRET_KEY: test-only-key-012345678901234567890123456789

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q
