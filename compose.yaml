x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://jobtracker:local_dev_password@db:5432/jobtracker
  BROKER_URL: redis://redis:6379/0
  EMAIL_DELIVERY_ENABLED: "true"
  EMAIL_TRANSPORT: mailpit
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURITY: none
  FRONTEND_URL: http://127.0.0.1:5173

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: jobtracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  testdb:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: jobtracker_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build: .
    env_file:
      - .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build: .
    env_file:
      - .env
    environment: *app-environment
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  beat:
    build: .
    env_file:
      - .env
    environment: *app-environment
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: